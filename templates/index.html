<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pest Detection System</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "TT Interphases", -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, sans-serif;
        background: #f8f9fa;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, #2d5016, #4a7c59);
        color: white;
        padding: 30px;
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      .header::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="80" cy="30" r="1.5" fill="rgba(255,255,255,0.1)"/><circle cx="40" cy="70" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="70" cy="80" r="2.5" fill="rgba(255,255,255,0.1)"/></svg>')
          repeat;
        animation: float 20s linear infinite;
        pointer-events: none;
      }

      @keyframes float {
        0% {
          transform: translateX(-50px) translateY(-50px);
        }
        100% {
          transform: translateX(50px) translateY(50px);
        }
      }

      .header h1 {
        font-size: 2.5rem;
        font-weight: 600;
        margin-bottom: 10px;
        position: relative;
        z-index: 1;
      }

      .header p {
        opacity: 0.9;
        font-size: 1.1rem;
        position: relative;
        z-index: 1;
      }

      .main-content {
        padding: 30px;
      }

      .detection-layout {
        display: grid;
        grid-template-columns: 1fr 400px;
        gap: 30px;
        margin-top: 20px;
      }

      .video-section {
        min-width: 0;
      }

      .description-panel {
        background: linear-gradient(135deg, #f8f9fa, #e8f5e8);
        border-radius: 12px;
        padding: 20px;
        border: 1px solid #e0e0e0;
        height: fit-content;
        max-height: 600px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .panel-header {
        position: sticky;
        top: 0;
        background: linear-gradient(135deg, #f8f9fa, #e8f5e8);
        padding-bottom: 15px;
        z-index: 2;
        border-bottom: 2px solid #e0e0e0;
        margin-bottom: 15px;
      }

      .panel-header h3 {
        color: #2e7d32;
        font-size: 1.3rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .detection-count {
        background: #2e7d32;
        color: white;
        padding: 4px 12px;
        border-radius: 16px;
        font-size: 0.9rem;
        font-weight: 600;
      }

      .clear-detections-btn {
        background: #ff9800;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: "TT Interphases", sans-serif;
        margin-top: 8px;
      }

      .clear-detections-btn:hover {
        background: #f57c00;
        transform: translateY(-1px);
      }

      .detections-scroll {
        overflow-y: auto;
        flex: 1;
        padding-right: 5px;
      }

      .detections-scroll::-webkit-scrollbar {
        width: 8px;
      }

      .detections-scroll::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 10px;
      }

      .detections-scroll::-webkit-scrollbar-thumb {
        background: #4caf50;
        border-radius: 10px;
      }

      .detections-scroll::-webkit-scrollbar-thumb:hover {
        background: #45a049;
      }

      .detection-item {
        background: white;
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 12px;
        border: 2px solid transparent;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .detection-item::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 4px;
        background: linear-gradient(180deg, #4caf50, #2e7d32);
        transition: width 0.3s ease;
      }

      .detection-item:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 16px rgba(76, 175, 80, 0.2);
        border-color: #4caf50;
      }

      .detection-item:hover::before {
        width: 6px;
      }

      .detection-item.inactive {
        opacity: 0.6;
        border-color: #e0e0e0;
      }

      .detection-item.inactive::before {
        background: linear-gradient(180deg, #bdbdbd, #9e9e9e);
      }

      @keyframes slideInFade {
        from {
          opacity: 0;
          transform: translateX(30px) scale(0.95);
        }
        to {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
      }

      .detection-item.new-detection {
        animation: slideInFade 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .detection-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 10px;
      }

      .detection-title {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
      }

      .status-indicator {
        font-size: 0.7rem;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.7;
          transform: scale(1.1);
        }
      }

      .detection-name {
        color: #2e7d32;
        font-size: 1.05rem;
        font-weight: 600;
        margin: 0;
      }

      .detection-badges {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .confidence-badge {
        background: linear-gradient(135deg, #4caf50, #2e7d32);
        color: white;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 0.8rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .detection-meta {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }

      .category-tag {
        display: inline-flex;
        align-items: center;
        background: #e8f5e8;
        color: #2e7d32;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 0.8rem;
        font-weight: 500;
      }

      .time-tag {
        display: inline-flex;
        align-items: center;
        background: #fff3e0;
        color: #e65100;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 0.8rem;
        font-weight: 500;
      }

      .detection-description {
        color: #555;
        line-height: 1.5;
        font-size: 0.9rem;
        margin: 0;
      }

      .no-detections {
        text-align: center;
        padding: 60px 20px;
        color: #999;
      }

      .no-detections-icon {
        font-size: 3.5rem;
        margin-bottom: 15px;
        opacity: 0.4;
        animation: float-icon 3s ease-in-out infinite;
      }

      @keyframes float-icon {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      .no-detections p {
        font-size: 1rem;
        line-height: 1.6;
      }

      .status {
        text-align: center;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 30px;
        font-weight: 500;
        font-size: 16px;
      }

      .status-idle {
        background: #fff8e1;
        color: #e65100;
        border: 1px solid #ffcc02;
        border-left: 4px solid #ff9800;
      }

      .status-running {
        background: #e8f5e8;
        color: #2e7d32;
        border: 1px solid #4caf50;
        border-left: 4px solid #4caf50;
      }

      .status-error {
        background: #ffebee;
        color: #c62828;
        border: 1px solid #f44336;
        border-left: 4px solid #f44336;
      }

      .video-container {
        position: relative;
        width: 100%;
        max-width: 800px;
        margin: 0 auto 30px;
        border-radius: 8px;
        overflow: hidden;
        border: 2px solid #e9ecef;
        background: #f8f9fa;
      }

      #videoStream {
        width: 100%;
        height: auto;
        display: block;
      }

      .camera-selection {
        text-align: center;
        margin-bottom: 20px;
      }

      .camera-selection label {
        display: block;
        margin-bottom: 10px;
        font-weight: 500;
        color: #2e7d32;
        font-size: 1rem;
      }

      .camera-select {
        padding: 10px 20px;
        border: 2px solid #4caf50;
        border-radius: 6px;
        font-size: 16px;
        font-family: "TT Interphases", sans-serif;
        background: white;
        color: #2e7d32;
        cursor: pointer;
        transition: all 0.2s ease;
        min-width: 250px;
      }

      .camera-select:hover {
        border-color: #2e7d32;
        box-shadow: 0 2px 8px rgba(76, 175, 80, 0.2);
      }

      .camera-select:focus {
        outline: none;
        border-color: #2e7d32;
        box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
      }

      .camera-select:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .controls {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 30px;
      }

      .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: "TT Interphases", sans-serif;
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .btn-start {
        background: linear-gradient(135deg, #4caf50, #2e7d32);
        color: white;
        box-shadow: 0 2px 8px rgba(76, 175, 80, 0.3);
      }

      .btn-start:hover:not(:disabled) {
        background: linear-gradient(135deg, #45a049, #1b5e20);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
      }

      .btn-stop {
        background: linear-gradient(135deg, #f44336, #c62828);
        color: white;
        box-shadow: 0 2px 8px rgba(244, 67, 54, 0.3);
      }

      .btn-stop:hover:not(:disabled) {
        background: linear-gradient(135deg, #d32f2f, #b71c1c);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(244, 67, 54, 0.4);
      }

      .loading {
        display: none;
        text-align: center;
        padding: 40px;
      }

      .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #2c3e50;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
        margin: 0 auto 15px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .detection-panel {
        background: linear-gradient(135deg, #f8f9fa, #e8f5e8);
        border-radius: 12px;
        padding: 25px;
        margin-top: 20px;
        border: 1px solid #e0e0e0;
      }

      .detection-panel h3 {
        color: #2e7d32;
        margin-bottom: 20px;
        font-size: 1.4rem;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .insect-info {
        background: white;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 15px;
        border-left: 4px solid #4caf50;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .insect-info h4 {
        color: #2e7d32;
        margin-bottom: 8px;
        font-size: 1.1rem;
      }

      .insect-info p {
        color: #555;
        line-height: 1.5;
        font-size: 0.95rem;
      }

      @media (max-width: 768px) {
        .container {
          margin: 10px;
        }

        .header {
          padding: 20px;
        }

        .header h1 {
          font-size: 2rem;
        }

        .main-content {
          padding: 20px;
        }

        .detection-layout {
          grid-template-columns: 1fr;
          gap: 20px;
        }

        .description-panel {
          max-height: 400px;
        }

        .camera-select {
          width: 100%;
          max-width: 300px;
        }

        .controls {
          flex-direction: column;
          align-items: center;
        }

        .btn {
          width: 200px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🐛 Real-Time Pest Detection System</h1>
        <p>Real-time object identification and monitoring</p>
      </div>

      <div class="main-content">
        <div id="status" class="status status-idle">
          🐛 Ready to start detection
        </div>

        <div class="camera-selection">
          <label for="cameraSelect">📷 Select Camera:</label>
          <select id="cameraSelect" class="camera-select">
            <option value="0">Camera 0 (Built-in)</option>
            <option value="1">Camera 1 (External)</option>
          </select>
        </div>

        <div class="controls">
          <button id="startBtn" class="btn btn-start">
            🔍 Start Detection
          </button>
          <button id="stopBtn" class="btn btn-stop" disabled>
            ⏹️ Stop Detection
          </button>
        </div>

        <div class="detection-layout">
          <div class="video-section">
            <div class="video-container">
              <img
                id="videoStream"
                src=""
                alt="Video Stream"
                style="display: none"
              />
              <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Initializing detection...</p>
              </div>
            </div>
          </div>

          <div class="description-panel">
            <div class="panel-header">
              <h3>
                <span>📋 Detected Objects</span>
                <span id="detectionCount" class="detection-count">0</span>
              </h3>
              <button
                id="clearBtn"
                class="clear-detections-btn"
                style="display: none"
              >
                🗑️ Clear History
              </button>
            </div>
            <div class="detections-scroll" id="detectionsContainer">
              <div class="no-detections">
                <div class="no-detections-icon">🔍</div>
                <p>Start detection to see real-time object information</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      let isDetecting = false;
      let detectionInterval = null;
      let persistentDetections = {}; // Store all detected objects

      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const videoStream = document.getElementById("videoStream");
      const status = document.getElementById("status");
      const loading = document.getElementById("loading");
      const cameraSelect = document.getElementById("cameraSelect");
      const detectionsContainer = document.getElementById(
        "detectionsContainer"
      );
      const detectionCount = document.getElementById("detectionCount");
      const clearBtn = document.getElementById("clearBtn");

      startBtn.addEventListener("click", startDetection);
      stopBtn.addEventListener("click", stopDetection);
      clearBtn.addEventListener("click", clearDetections);

      function clearDetections() {
        persistentDetections = {};
        updateDetectionsDisplay([]);
      }

      async function startDetection() {
        try {
          loading.style.display = "block";
          videoStream.style.display = "none";
          status.textContent = "🐛 Initializing detection...";
          status.className = "status status-idle";

          const cameraIndex = cameraSelect.value;
          const response = await fetch(
            `/start_detection?camera=${cameraIndex}`
          );
          const result = await response.json();

          if (result.status === "success") {
            videoStream.src = "/video_feed?" + new Date().getTime();
            videoStream.style.display = "block";
            loading.style.display = "none";

            isDetecting = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            cameraSelect.disabled = true;
            status.textContent = "🐛 Detection active...";
            status.className = "status status-running";

            // Reset persistent detections for new session
            persistentDetections = {};

            // Start polling for detections
            startDetectionPolling();
          } else {
            throw new Error(result.message);
          }
        } catch (error) {
          loading.style.display = "none";
          status.textContent = `Error: ${error.message}`;
          status.className = "status status-error";
          console.error("Error starting detection:", error);
        }
      }

      async function stopDetection() {
        try {
          const response = await fetch("/stop_detection");
          const result = await response.json();

          if (result.status === "success") {
            videoStream.src = "";
            videoStream.style.display = "none";

            isDetecting = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            cameraSelect.disabled = false;
            status.textContent = "🐛 Detection stopped";
            status.className = "status status-idle";

            // Stop polling for detections
            stopDetectionPolling();

            // Reset persistent detections
            persistentDetections = {};
            detectionCount.textContent = "0";
            clearBtn.style.display = "none";

            // Reset detections display
            detectionsContainer.innerHTML = `
              <div class="no-detections">
                <div class="no-detections-icon">🔍</div>
                <p>Start detection to see real-time object information</p>
              </div>
            `;
          } else {
            throw new Error(result.message);
          }
        } catch (error) {
          status.textContent = `Error: ${error.message}`;
          status.className = "status status-error";
          console.error("Error stopping detection:", error);
        }
      }

      function startDetectionPolling() {
        // Poll for detections every 500ms
        detectionInterval = setInterval(fetchDetections, 500);
      }

      function stopDetectionPolling() {
        if (detectionInterval) {
          clearInterval(detectionInterval);
          detectionInterval = null;
        }
      }

      async function fetchDetections() {
        try {
          const response = await fetch("/get_detections");
          const result = await response.json();

          if (result.status === "success") {
            updateDetectionsDisplay(result.detections);
          }
        } catch (error) {
          console.error("Error fetching detections:", error);
        }
      }

      function updateDetectionsDisplay(detections) {
        // Add new detections to persistent storage
        const newDetections = [];

        detections.forEach((detection) => {
          const className = detection.class;

          if (!persistentDetections[className]) {
            // New detection - add it
            persistentDetections[className] = {
              ...detection,
              currentlyVisible: true,
              firstSeen: Date.now(),
              lastSeen: Date.now(),
            };
            newDetections.push(className);
          } else {
            // Update existing detection
            persistentDetections[className].currentlyVisible = true;
            persistentDetections[className].lastSeen = Date.now();
            // Update confidence if higher
            if (
              detection.confidence > persistentDetections[className].confidence
            ) {
              persistentDetections[className].confidence = detection.confidence;
            }
          }
        });

        // Mark objects not in current detections as not currently visible
        const currentClasses = new Set(detections.map((d) => d.class));
        Object.keys(persistentDetections).forEach((className) => {
          if (!currentClasses.has(className)) {
            persistentDetections[className].currentlyVisible = false;
          }
        });

        // Update detection count
        const count = Object.keys(persistentDetections).length;
        detectionCount.textContent = count;

        // Show/hide clear button
        clearBtn.style.display = count > 0 ? "block" : "none";

        // Display all persistent detections
        if (count === 0) {
          detectionsContainer.innerHTML = `
            <div class="no-detections">
              <div class="no-detections-icon">👀</div>
              <p>No objects detected yet.<br>Point camera at objects to detect them.</p>
            </div>
          `;
          return;
        }

        let html = "";
        Object.values(persistentDetections).forEach((detection) => {
          const info = detection.info;
          const isActive = detection.currentlyVisible;
          const statusIndicator = isActive ? "🟢" : "⚪";
          const itemClass = isActive
            ? "detection-item"
            : "detection-item inactive";
          const isNew = newDetections.includes(detection.class);
          const animationClass = isNew ? " new-detection" : "";

          // Format time
          const timeAgo = getTimeAgo(detection.firstSeen);

          html += `
            <div class="${itemClass}${animationClass}">
              <div class="detection-header">
                <div class="detection-title">
                  <span class="status-indicator">${statusIndicator}</span>
                  <h4 class="detection-name">${info.name}</h4>
                </div>
                <div class="detection-badges">
                  <span class="confidence-badge">${detection.confidence}%</span>
                </div>
              </div>
              <div class="detection-meta">
                <span class="category-tag">📁 ${info.category}</span>
                <span class="time-tag">🕒 ${timeAgo}</span>
              </div>
              <p class="detection-description">${info.description}</p>
            </div>
          `;
        });

        detectionsContainer.innerHTML = html;
      }

      function getTimeAgo(timestamp) {
        const seconds = Math.floor((Date.now() - timestamp) / 1000);

        if (seconds < 5) return "Just now";
        if (seconds < 60) return `${seconds}s ago`;

        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return `${minutes}m ago`;

        const hours = Math.floor(minutes / 60);
        return `${hours}h ago`;
      }

      // Handle video stream errors
      videoStream.addEventListener("error", function () {
        if (isDetecting) {
          status.textContent =
            "🐛 Camera error - Please check camera connection";
          status.className = "status status-error";
          startBtn.disabled = false;
          stopBtn.disabled = true;
          cameraSelect.disabled = false;
          isDetecting = false;
          stopDetectionPolling();
        }
      });
    </script>
  </body>
</html>
